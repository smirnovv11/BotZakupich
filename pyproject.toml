[tool.poetry]
name = "zakupich"
version = "0.1.0"
description = "Personal Telegram shopping-list bot."
authors = ["sqd12"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
aiogram = ">=3.0,<4.0"
pydantic = ">=2.0,<3.0"
pydantic-settings = ">=2.0,<3.0"
sqlalchemy = { version = ">=2.0,<3.0", extras = ["asyncio"] }
asyncpg = ">=0.29,<1.0"
alembic = ">=1.13,<2.0"
python-dotenv = ">=1.0,<2.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<9.0"
pytest-asyncio = ">=0.23,<1.0"
ruff = ">=0.5,<1.0"
pre-commit = ">=3.7,<5.0"

[tool.ruff]
line-length = 88
src = ["app", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
]

[tool.ruff.format]
line-ending = "lf"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
